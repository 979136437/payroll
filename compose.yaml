name: payroll
services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DB_HOST: ${DB_HOST:?DB_HOST required}
      DB_PORT: ${DB_PORT:?DB_PORT required}
      DB_NAME: ${DB_NAME:?DB_NAME required}
      DB_USER: ${DB_USER:?DB_USER required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
