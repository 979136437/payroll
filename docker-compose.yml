services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7788:3000"
    restart: always
    volumes:
      - type: volume
        source: payroll-data
        target: /app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://nextjs-app:3000 --protocol http2
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - nextjs-app
    restart: always

volumes:
  payroll-data:
