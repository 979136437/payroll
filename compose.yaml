name: payroll-production
services:
  migrate:
    build:
      context: .
      target: migrator
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DB_FILE: /data/payroll.sqlite
    volumes:
      - sqlite_data:/data
    command: ["pnpm", "db:migrate:prod"]
    restart: "no"
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_FILE: /data/payroll.sqlite
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - sqlite_data:/data
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  sqlite_data:

